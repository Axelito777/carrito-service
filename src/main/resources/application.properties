server.port=8082
spring.application.name=carrito-service

spring.datasource.url=jdbc:h2:mem:carritodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka (solo productor): eventos de usuario para ms-analytics-recommendations
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Máximo (ms) que se espera a Kafka al publicar; si se supera, la respuesta sale igual
kafka.producer.max-block-ms=${KAFKA_MAX_BLOCK_MS:3000}
